apiVersion: v1
kind: Service
metadata:
  name: {{ include "wordpress.fullname" . }}
  labels:
    {{- include "wordpress.labels" (dict "root" . "component" "wordpress") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "wordpress.selectorLabels" (dict "root" . "component" "wordpress") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
