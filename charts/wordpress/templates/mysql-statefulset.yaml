apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "wordpress.mysqlName" . }}
  labels:
    {{- include "wordpress.labels" (dict "root" . "component" "mysql") | nindent 4 }}
spec:
  serviceName: {{ include "wordpress.mysqlName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "wordpress.selectorLabels" (dict "root" . "component" "mysql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wordpress.selectorLabels" (dict "root" . "component" "mysql") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- with .Values.mysql.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mysql
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.rootPasswordKey }}
            - name: MYSQL_DATABASE
              value: {{ .Values.database.name | quote }}
            - name: MYSQL_USER
              value: {{ .Values.database.user | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.passwordKey }}
          ports:
            - name: mysql
              containerPort: 3306
          # The server listens on the network only after its first start has
          # created the database, so the port check also covers that step.
          startupProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              # A sub-directory keeps the lost+found folder of a new ext4
              # volume out of the MySQL data directory.
              subPath: mysql
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
          {{- with .Values.mysql.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if not .Values.mysql.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.mysql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "wordpress.selectorLabels" (dict "root" . "component" "mysql") | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.mysql.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mysql.persistence.size }}
  {{- end }}
