apiVersion: v1
kind: Service
metadata:
  name: {{ include "wordpress.mysqlName" . }}
  labels:
    {{- include "wordpress.labels" (dict "root" . "component" "mysql") | nindent 4 }}
spec:
  # A headless Service gives the StatefulSet a stable DNS name.
  clusterIP: None
  selector:
    {{- include "wordpress.selectorLabels" (dict "root" . "component" "mysql") | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
