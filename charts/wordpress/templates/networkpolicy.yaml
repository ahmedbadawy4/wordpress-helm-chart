{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wordpress.mysqlName" . }}
  labels:
    {{- include "wordpress.labels" (dict "root" . "component" "mysql") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "wordpress.selectorLabels" (dict "root" . "component" "mysql") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "wordpress.selectorLabels" (dict "root" . "component" "wordpress") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3306
{{- end }}
